services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-lenny}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  agent:
    build: ./agent
    environment:
      HOST: 0.0.0.0
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-lenny-growth:8b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-240}
    extra_hosts: [host.docker.internal:host-gateway]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lenny}:${POSTGRES_PASSWORD:-lenny-local-only}@db:5432/${POSTGRES_DB:-lenny}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      AGENT_URL: http://agent:3001
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-ollama}
      RETRIEVAL_THRESHOLD: ${RETRIEVAL_THRESHOLD:-0.45}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-240}
      CORS_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [./data:/data]
    depends_on:
      db: {condition: service_healthy}
      agent: {condition: service_started}
    extra_hosts: [host.docker.internal:host-gateway]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:80"]
    depends_on: [backend]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: [cpu]
    volumes: [ollama_data:/root/.ollama]
    ports: [127.0.0.1:11434:11434]
volumes:
  postgres_data:
  ollama_data:
